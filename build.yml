name: Build Mod
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: Iwoho-Visuals-Mod
          path: build/libs/iwoho-visuals-1.0.0.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mod-latest
          name: Iwoho Visuals Mod (последняя версия)
          files: build/libs/iwoho-visuals-1.0.0.jar
